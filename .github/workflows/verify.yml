name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - optimization/**

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The serialized browser race suite includes real cadence and finish timing.
    # Leave enough room for one CI retry without cancelling the remaining checks.
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production release gates
        run: |
          npm run verify:release || {
            exit_code=$?
            if [ "$exit_code" -ne 75 ]; then
              exit "$exit_code"
            fi
            echo "::warning::npm audit remained unavailable after bounded retries; continuing application verification."
            npm run build
            npm run test:unit
          }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser race tests
        run: npm run test:e2e

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
