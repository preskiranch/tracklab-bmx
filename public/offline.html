<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="#05080c" name="theme-color" />
    <title>TrackLab BMX is offline</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: radial-gradient(circle at 50% 20%, #17351f 0, #0b1510 34%, #05080c 72%);
        color: #f7fbf8;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main { max-width: 460px; }
      .mark {
        align-items: center;
        background: #84ff31;
        border-radius: 20px;
        color: #071008;
        display: inline-flex;
        font-size: 30px;
        font-weight: 900;
        height: 64px;
        justify-content: center;
        width: 64px;
      }
      h1 { font-size: clamp(28px, 7vw, 42px); letter-spacing: -0.04em; margin: 24px 0 12px; }
      p { color: #c4d1c8; font-size: 17px; line-height: 1.5; margin: 0 auto 24px; }
      button {
        appearance: none;
        background: #84ff31;
        border: 0;
        border-radius: 14px;
        color: #071008;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        min-height: 50px;
        padding: 12px 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true" class="mark">TL</div>
      <h1>TrackLab is temporarily offline</h1>
      <p>This app is installed on your device, and your saved training data is safe. Check this tablet’s internet connection, then try again.</p>
      <button onclick="window.location.reload()" type="button">Try Again</button>
    </main>
  </body>
</html>
