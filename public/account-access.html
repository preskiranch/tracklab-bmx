<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Account help · TrackLab BMX</title><link rel="stylesheet" href="/account-access.css"><script defer src="/account-access.js"></script></head><body><main><p>TRACKLAB BMX</p><h1 id="title">Account help</h1><p id="description">Verify your email or reset your password.</p><form id="form"><label id="email-label">Email address<input id="email" type="email" autocomplete="email" maxlength="254"></label><label id="new-email-label" hidden>Correct email address<input id="new-email" type="email" autocomplete="email" maxlength="254"></label><label id="password-label" hidden>New password<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128"><small>At least 8 characters.</small></label><label id="confirm-label" hidden>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128"></label><button id="submit" type="submit">Send email</button></form><p id="status" role="status" aria-live="polite"></p><nav><button id="correct" type="button">Correct signup email</button><button id="resend" type="button">Resend verification email</button><button id="reset" type="button">Forgot password?</button><a href="/" id="back">Back to TrackLab</a></nav><p class="note">Using the iPhone or iPad app? Return to TrackLab after completing this step. Your parent manages access for a child without email.</p></main></body></html>
