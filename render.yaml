services:
  - type: web
    name: tracklab-bmx
    runtime: node
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev --omit=optional
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: APPLE_MAPKIT_JS_TOKEN
        sync: false
      - key: VITE_WATTBIKE_BRIDGE_URL
        sync: false
      - key: VITE_TRACKLAB_MULTIPLAYER_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TRACKLAB_REQUIRE_DATABASE
        value: "1"
      - key: TRACKLAB_ADMIN_EMAILS
        sync: false
      - key: TRACKLAB_OFFICIAL_ACCOUNT_BOOTSTRAP_TOKEN
        sync: false
      - key: TRACKLAB_METRICS_TOKEN
        sync: false
      - key: TRACKLAB_LOG_HTTP
        value: "0"
      - key: TRACKLAB_SLOW_REQUEST_MS
        value: "1000"
      - key: TRACKLAB_APNS_ENABLED
        value: "1"
      - key: TRACKLAB_APNS_TEAM_ID
        sync: false
      - key: TRACKLAB_APNS_KEY_ID
        sync: false
      - key: TRACKLAB_APNS_PRIVATE_KEY
        sync: false
      - key: TRACKLAB_PUSH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TRACKLAB_PUSH_TOKEN_FINGERPRINT_KEY
        sync: false
      - key: TRACKLAB_PUSH_TOKEN_KEY_VERSION
        value: "1"
      - key: TRACKLAB_PUSH_TOKEN_PREVIOUS_ENCRYPTION_KEYS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TRACKLAB_APPLE_IAP_ENABLED
        value: "0"
      - key: TRACKLAB_APPLE_ONLY_CUTOVER
        value: "0"
      - key: TRACKLAB_APPLE_BUNDLE_ID
        value: com.preskilranch.tracklabbmx
      - key: TRACKLAB_APPLE_APP_ID
        sync: false
      - key: TRACKLAB_APPLE_SUBSCRIPTION_GROUP_ID
        sync: false
      - key: TRACKLAB_APPLE_ISSUER_ID
        sync: false
      - key: TRACKLAB_APPLE_KEY_ID
        sync: false
      - key: TRACKLAB_APPLE_PRIVATE_KEY
        sync: false
      - key: TRACKLAB_APPLE_RECONCILE_INTERVAL_MS
        value: "900000"
      - key: TRACKLAB_APPLE_RECONCILE_BATCH_SIZE
        value: "100"
      - key: TRACKLAB_APPLE_SANDBOX_ACCOUNT_TOKENS
        sync: false
